  rationale: The window shows the longest repeated failure was the vault and secrets loop on 2026-11-06 from about 06:35 to 07:06, when the assistant correctly refused to repeat or send secrets but then repeated the same short file and line categorisation about 15 to 20 times while the user grew frustrated and sent the vault master password again twice. The existing custom-connector-setup skill only says never to ask the user to paste a key in chat and never to store a secret, and no searched skill covers a user-initiated paste, a single authoritative reply, or de-escalation. This new skill teaches exactly that one reply, one rotation offer, and recording only locations, so the next paste does not restart the loop.
