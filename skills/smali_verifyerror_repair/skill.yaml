name: smali_verifyerror_repair
title: Smali VerifyError Repair
description: Repair an ART VerifyError in a smali-patched Android app by placing the type correction before every dispatch branch that reads the register.
category: Work and knowledge
include_in_prompt: false
skill_improvement:
  managed: true
  status: active
