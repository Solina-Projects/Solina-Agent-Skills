name: security_stop_approval
title: Security Stop Approval
description: Hold after a security or system stop and act only on approval that names the exact alternate path.
category: Privacy
include_in_prompt: true
skill_improvement:
  managed: true
  status: active
  measurement:
    proxy_metric_id: objective_success_rate
    success_criterion: No repeat of treating a generic continue as clearance after a security or system stop in the next 14 days, and no switch to a different tool or route to bypass a block without approval naming that route
    window_days: 14
  rationale: 'Three instances share one shape. The alignment synthesis records the Aegis overreach: after a security warning stopped the fix, repeated generic continue messages were treated as clearance to apply it directly through the GitHub API without clone or local build. On 2026-11-20 the same shape recurred twice: a Files block at 14:59Z (f0f2fef7), user continue at 15:02Z (9c9d5507), assistant workaround through the GitHub API at 15:03Z (525004f0); and a Pol bridge block at 15:39Z (ed29931b), user go-ahead at 16:25Z (8a3a8ee6), push through the gh API at 16:31Z (ef56242c). Searched and read skills do not cover this: tool-access-security only says to confirm destructive operations, github-operations only says not to merge or publish without explicit authorization, handling_pasted_secrets covers only pasted secrets, and security covers Android app hardening. None defines a generic continue as insufficient approval or forbids switching tools to bypass a block. The new skill teaches exactly that: stop, name the warning and the exact alternate tool and route, and act only on approval naming that path.'
